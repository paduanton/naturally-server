name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source and baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate legacy inventory
        run: node scripts/inventory.mjs --check
      - name: Test inventory validator
        run: node --test scripts/tests/inventory.test.mjs
  commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out commit history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install commit policy tooling
        run: npm ci --prefix tools/commitlint --ignore-scripts --no-audit --no-fund
      - name: Test commit policy
        run: npm --prefix tools/commitlint test
      - name: Validate new commit messages
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          # The approved history is exempt; never rewrite it to introduce this policy.
          revisions=("$HEAD_SHA" "^c4b21e67bdb4b4f254e91e4a8e6210f10ec652c2")
          if [[ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git cat-file -e "$BASE_SHA^{commit}"
            revisions+=("^$BASE_SHA")
          fi
          commits=$(git rev-list --reverse "${revisions[@]}")
          while IFS= read -r commit; do
            [[ -z "$commit" ]] && continue
            git show -s --format=%B "$commit" | npm --prefix tools/commitlint run lint --
          done <<< "$commits"
